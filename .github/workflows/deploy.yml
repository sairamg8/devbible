name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Allows publishing by hand from the Actions tab without a push.
  workflow_dispatch:

# GITHUB_TOKEN needs these to hand the built site to the Pages service.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time. In-progress runs finish rather than being cancelled,
# so a half-uploaded artifact never becomes the live site.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Must precede setup-node: its `cache: yarn` shells out to `yarn cache
      # dir`, which the runner's global Yarn 1 refuses to answer once
      # package.json pins packageManager to yarn 4.
      - name: Enable corepack
        run: corepack enable

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: yarn

      - name: Install dependencies
        run: yarn install --immutable

      # pipefail matters: without it the exit status would come from tee.
      - name: Build
        shell: bash
        # 🔴 Why the heap is raised: on 2026-09-08 three runs in a row died as
        # `exit code 143` — SIGTERM, ~3m40s-4m45s into a build that takes 10-13
        # minutes when it passes, with NO Docusaurus output after "Creating an
        # optimized production build...". A broken link cannot do that: it
        # prints an error and fails. A killed process is what that looks like,
        # and the corpus had just crossed 6,419 pages / ~1.4M lines.
        #
        # ⚠️ Honest caveat: 143 is SIGTERM, not the OOM killer's SIGKILL (137),
        # and V8's own heap exhaustion aborts with 134 and a "JS heap out of
        # memory" banner. So memory pressure is the leading explanation, not a
        # proven one. If 143 returns WITH this set, the cause is elsewhere —
        # do not just raise the number again.
        #
        # 4096 -> 8192 applies to the MAIN thread, which is the one that grows.
        # The 4 SSG workers `yarn build` spawns are already bounded by
        # DOCUSAURUS_SSG_WORKER_THREAD_RECYCLER_MAX_MEMORY=500000000 in
        # package.json, so worst case is ~8GB + ~2GB on a 16GB runner. Raising
        # this past ~10GB starts trading an OOM for swap-thrash.
        env:
          NODE_OPTIONS: --max-old-space-size=8192
        run: |
          set -o pipefail
          yarn build 2>&1 | tee build.log

      # 🔴 There are TWO link settings and they behave in OPPOSITE ways. This
      # comment claimed both were 'warn' until 2026-09-08; they have not been
      # since 2026-09-05, which is exactly the sort of thing you read while
      # debugging a red deploy and believe.
      #
      #   docusaurus.config.js:72  onBrokenLinks: 'throw'
      #     A broken ROUTE link fails the Build step above outright. This
      #     reporting step is NOT what catches those — by the time it runs the
      #     build is already red.
      #
      #   docusaurus.config.js:75  onBrokenMarkdownLinks: 'warn'
      #     A broken MARKDOWN link only warns. This step is the ONLY place
      #     those ever surface, which is why it exists and why it is
      #     `if: always()`.
      #
      # So the count below is the markdown-link class, plus whatever the build
      # printed before throwing. `exit 1` here would gate the warn-only class
      # once it reaches zero; the throwing class already gates itself.
      #
      # 🔴 Why any of this matters: when Build fails, `deploy` is SKIPPED, not
      # failed. The workflow shows ONE X, not two, and the live site keeps
      # serving the last good version — so a red deploy looks like no deploy.
      # This checkout is shared, so one lane's dangling link blocks every other
      # lane's publish. Run `yarn linkcheck` before reporting a file done.
      - name: Report broken links
        if: always()
        shell: bash
        run: |
          if grep -iE "couldn't be resolved|broken link|broken anchor" build.log > links.txt; then
            echo "::warning::$(wc -l < links.txt) unresolved link warning(s)."
            { echo '### Unresolved links'; echo '```'; cat links.txt; echo '```'; } \
              >> "$GITHUB_STEP_SUMMARY"
          else
            echo '### No broken links' >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
